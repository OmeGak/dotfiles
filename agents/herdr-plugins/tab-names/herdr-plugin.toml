id = "tab-names"
name = "Tab Names"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Label every tab after what runs in it (terminal title) or its directory."
platforms = ["linux", "macos"]

# Every hook runs the same idempotent, coalesced sync. tab.renamed is
# deliberately NOT subscribed, so our own renames cannot feed back.
[[startup]]
command = ["python3", "tab_names.py", "sync"]

# Shell hooks (zsh/fish) invoke this after a prompt, to pick up cd / titles.
[[actions]]
id = "sync"
title = "Sync tab names"
contexts = ["global"]
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "tab.created"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "tab.focused"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.created"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.focused"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.closed"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.exited"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.moved"
command = ["python3", "tab_names.py", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["python3", "tab_names.py", "sync"]

# Fires often; it is the only signal that an agent's terminal title changed.
[[events]]
on = "pane.agent_status_changed"
command = ["python3", "tab_names.py", "sync"]
