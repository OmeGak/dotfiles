onboarding = false

[keys]
previous_tab = "ctrl+alt+left"
next_tab = "ctrl+alt+right"
new_tab = "alt+t"
new_workspace = "alt+n"
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
move_tab_previous = "ctrl+alt+shift+left"
move_tab_next = "ctrl+alt+shift+right"
focus_pane_left = ["shift+alt+left"]
focus_pane_down = ["shift+alt+down"]
focus_pane_up = ["shift+alt+up"]
focus_pane_right = ["shift+alt+right"]
close_pane = ["alt+w", "ctrl+alt+w"]
close_tab = "shift+alt+w"
zoom = "alt+enter"
previous_agent = "ctrl+alt+shift+up"
next_agent = "ctrl+alt+shift+down"
open_notification_target = "alt+o"
help = "alt+?"
detach = "alt+d"
settings = "alt+."
reload_config = "alt+r"
goto = "alt+p"
workspace_picker = "ctrl+alt+space"
navigate_workspace_up = ["up"]
navigate_workspace_down = ["down"]
split_vertical = "alt+\\"
split_horizontal = "alt+|"

[[keys.command]]
key = "ctrl+alt+\\"
type = "shell"
description = "split right running claude"
command = 'p=$("$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction right --focus | jq -r .result.pane.pane_id) && "$HERDR_BIN_PATH" pane run "$p" claude'

[[keys.command]]
key = "ctrl+alt+|"
type = "shell"
description = "split down running claude"
command = 'p=$("$HERDR_BIN_PATH" pane split --pane "$HERDR_ACTIVE_PANE_ID" --direction down --focus | jq -r .result.pane.pane_id) && "$HERDR_BIN_PATH" pane run "$p" claude'

[[keys.command]]
key = "ctrl+alt+t"
type = "shell"
description = "new tab running claude"
command = 'p=$("$HERDR_BIN_PATH" tab create --focus | jq -r .result.root_pane.pane_id) && "$HERDR_BIN_PATH" pane run "$p" claude'

[ui]
pane_borders = "always"
sidebar_width = 30
agent_panel_sort = "priority"

[ui.toast]
delivery = "herdr"

[theme]
name = "gruvbox"
auto_switch = false

# Space rows: native workspace name plus a `tabs` token that tab-names reports (tab count
# when >1 tabs, e.g. ".dotfiles · 3"; herdr joins tokens with " · "). Machines without the plugin show no count.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace", "$tabs"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "terminal_title_stripped"]]
